<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Phân Tích Chuyến Bay - VN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .col-min { width: 1%; white-space: nowrap; padding: 2px 4px !important; }
        table th, table td { padding: 2px 4px; font-size: 0.8rem; border: 1px solid #ccc; text-align: center; }
        @media (min-width: 768px) { table th, table td { font-size: 0.85rem; } }
        .header-bg { background-color: #f0ede1; }
        .section-header { background-color: #e6f0ff; font-weight: bold; text-align: left !important; padding: 4px !important; color: #003399; }
        .danger-bg { background-color: #ffe6e6 !important; color: #cc0000; font-weight: bold; text-align: left !important; padding: 4px !important; }
        .text-left { text-align: left !important; }
        
        /* Hiệu ứng thanh cuộn ngang mượt cho di động */
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake-err { animation: shake 0.3s; border-color: red; background-color: #fee2e2;}
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- MÀN HÌNH KHÓA -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-90 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 md:p-8 rounded-lg shadow-2xl w-full max-w-sm text-center">
            <div class="text-4xl text-blue-600 mb-4"><i class="fa-solid fa-plane-lock"></i></div>
            <h2 class="text-xl md:text-2xl font-bold mb-2">Hệ Thống Nội Bộ</h2>
            <p class="text-xs md:text-sm text-gray-500 mb-6">Vui lòng nhập mã PIN để truy cập</p>
            <input type="password" id="password-input" inputmode="numeric" maxlength="6" autofocus
                class="w-full border-2 border-gray-300 p-3 text-center text-2xl md:text-3xl tracking-[0.5em] md:tracking-[1em] rounded-lg focus:outline-none focus:border-blue-500 transition-colors font-mono" 
                placeholder="••••••">
            <p class="text-xs text-gray-400 mt-4" id="login-status">Hệ thống tự động đăng nhập khi đủ 6 số.</p>
        </div>
    </div>

    <!-- ỨNG DỤNG CHÍNH -->
    <div id="main-app" class="hidden flex-col h-full w-full">
        <!-- Header (Chỉ hiển thị trên máy tính, ẨN trên Mobile) -->
        <header class="hidden md:flex bg-white shadow z-10 p-4 justify-between items-center">
            <div class="flex-1 truncate pr-2">
                <h1 class="text-2xl font-bold text-gray-800 truncate">Trích xuất Oncarriage</h1>
                <p class="text-sm text-gray-500 truncate" id="db-status">Đang kết nối cơ sở dữ liệu...</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Nút Làm mới cho PC -->
                <button class="refresh-btn bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded shadow text-sm font-semibold flex-shrink-0">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Làm mới
                </button>
                <button class="logout-btn bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded shadow text-sm font-semibold flex-shrink-0">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                </button>
            </div>
        </header>

        <!-- Khung làm việc chính -->
        <div class="flex flex-col md:flex-row flex-1 overflow-hidden h-full">
            
            <!-- Phần 1: Khung Dán Dữ Liệu & Báo Cáo (Nằm trên cùng trên Mobile) -->
            <main class="w-full flex-1 md:h-full overflow-y-auto p-2 md:p-6 bg-gray-100 flex flex-col items-center order-1 md:order-2">
                <div class="w-full max-w-5xl h-full flex flex-col">
                    <div class="bg-white p-2 md:p-4 rounded shadow-sm border border-blue-200 mb-2 md:mb-6 shrink-0">
                        <label class="block text-xs md:text-sm font-semibold text-blue-700 mb-1 md:mb-2">Dán văn bản tổng hợp vào đây:</label>
                        <textarea id="data-input" rows="3" 
                            class="w-full border-2 border-dashed border-blue-300 p-2 md:p-3 rounded text-xs md:text-sm font-mono focus:outline-none focus:border-blue-50 focus:bg-blue-50 transition-colors resize-none" 
                            placeholder="Dán dữ liệu ONCARRIAGE CUSTOMER SUMMARY..."></textarea>
                    </div>
                    
                    <div id="report-container" class="w-full bg-white p-2 md:p-6 rounded shadow-lg flex-1 min-h-[150px] overflow-y-auto">
                        <div class="text-center text-gray-400 mt-10 md:mt-20 italic text-sm md:text-base">Chưa có dữ liệu hiển thị.</div>
                    </div>
                </div>
            </main>

            <!-- Phần 2: Lịch sử lưu trữ (Nằm nửa dưới trên Mobile, bên trái trên PC) -->
            <aside class="w-full h-1/2 md:h-full md:w-1/4 md:min-w-[280px] bg-white border-t-2 md:border-r flex flex-col shadow-inner order-2 md:order-1 border-gray-200 shrink-0">
                <div class="p-2 md:p-4 bg-gray-50 border-b font-bold text-gray-700 flex justify-between items-center text-sm md:text-base">
                    <span><i class="fa-solid fa-clock-rotate-left mr-2"></i>Lịch sử lưu trữ</span>
                    
                    <!-- Nút Tác vụ (Chỉ hiển thị trên Mobile) -->
                    <div class="flex items-center gap-2 md:hidden">
                        <!-- Nút Làm mới cho Mobile -->
                        <button class="refresh-btn bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded shadow text-xs font-semibold">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                        <button class="logout-btn bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded shadow text-xs font-semibold">
                            <i class="fa-solid fa-right-from-bracket"></i> Thoát
                        </button>
                    </div>
                </div>
                <div id="history-list" class="flex-1 overflow-y-auto p-2 space-y-2 bg-gray-50">
                    <div class="text-center text-gray-400 text-xs md:text-sm mt-4 md:mt-10">Đang tải dữ liệu...</div>
                </div>
            </aside>

        </div>
    </div>

    <!-- SCRIPT XỬ LÝ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz346rY9fXDixYI7i_R4EXms13Mrtmqq0",
            authDomain: "conxasoc-62823.firebaseapp.com",
            projectId: "conxasoc-62823",
            storageBucket: "conxasoc-62823.firebasestorage.app",
            messagingSenderId: "190029549849",
            appId: "1:190029549849:web:138c3f7e1bb9efe6e8b588"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            document.getElementById('db-status').innerText = "Đã kết nối máy chủ Firebase.";
            document.getElementById('db-status').classList.add('text-green-600');
        } catch (e) {
            document.getElementById('db-status').innerText = "Lỗi kết nối Firebase.";
            document.getElementById('db-status').classList.add('text-red-500');
        }

        // --- HỆ THỐNG MẬT KHẨU ---
        const PIN = "140482";
        const passInput = document.getElementById('password-input');
        const loginOverlay = document.getElementById('login-overlay');
        const mainApp = document.getElementById('main-app');

        if (sessionStorage.getItem('auth_chuyenbay') === 'true') {
            loginOverlay.classList.add('hidden');
            mainApp.classList.remove('hidden'); 
            mainApp.classList.add('flex');
            if(db) loadHistory();
        } else {
            passInput.focus();
        }

        passInput.addEventListener('input', function() {
            if (this.value.length === 6) {
                if (this.value === PIN) {
                    sessionStorage.setItem('auth_chuyenbay', 'true');
                    loginOverlay.classList.add('hidden');
                    mainApp.classList.remove('hidden'); 
                    mainApp.classList.add('flex');
                    if(db) loadHistory();
                    this.value = ''; 
                } else {
                    this.classList.add('shake-err');
                    document.getElementById('login-status').innerText = "Sai mã PIN, vui lòng thử lại!";
                    document.getElementById('login-status').classList.add('text-red-500');
                    setTimeout(() => {
                        this.classList.remove('shake-err');
                        this.value = ''; 
                        this.focus();
                    }, 500);
                }
            } else {
                document.getElementById('login-status').innerText = "Hệ thống tự động đăng nhập khi đủ 6 số.";
                document.getElementById('login-status').classList.remove('text-red-500');
            }
        });

        // Gắn sự kiện ĐĂNG XUẤT
        document.querySelectorAll('.logout-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sessionStorage.removeItem('auth_chuyenbay');
                mainApp.classList.remove('flex');
                mainApp.classList.add('hidden');
                loginOverlay.classList.remove('hidden');
                passInput.focus();
            });
        });

        // Gắn sự kiện LÀM MỚI (Refresh)
        document.querySelectorAll('.refresh-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Tạo hiệu ứng xoay cho icon
                let icon = btn.querySelector('i');
                icon.classList.add('fa-spin');
                setTimeout(() => icon.classList.remove('fa-spin'), 500);

                // Reset các khung nhập và hiển thị
                document.getElementById('data-input').value = '';
                document.getElementById('report-container').innerHTML = '<div class="text-center text-gray-400 mt-10 md:mt-20 italic text-sm md:text-base">Đã làm mới. Chưa có dữ liệu hiển thị.</div>';
                
                // Tải lại lịch sử từ đám mây
                if(db) loadHistory();
            });
        });

        // --- PHÂN TÍCH TEXT ---
        const dataInput = document.getElementById('data-input');
        dataInput.addEventListener('input', async function() {
            let text = this.value;
            if(text.trim().length > 100 && text.includes("ONCARRIAGE")) {
                let parsedObj = parseData(text);
                if(parsedObj && (parsedObj.results['Connection OK'].length > 0 || parsedObj.results['Inside Min Connection Time'].length > 0)) {
                    renderTable(parsedObj);
                    this.value = '';
                    if(db) {
                        try {
                            await addDoc(collection(db, 'reports'), { ...parsedObj, timestamp: serverTimestamp() });
                            loadHistory();
                        } catch (error) {
                            alert("Lỗi khi lưu lên Firebase: " + error.message);
                        }
                    }
                }
            }
        });

        function parseData(text) {
            const lines = text.split('\n');
            const results = { 'Inside Min Connection Time': [], 'Connection OK': [] };
            
            let inboundMatch = text.match(/(VN\d+)\s+(\d{2}[A-Z]{3})\s+([A-Z]{3})\s+STD(\d{4})?(?:\s*ETD(\d{4}))?/);
            let inboundFlight = inboundMatch ? inboundMatch[1] : "UNKNOWN";
            let inboundDate = inboundMatch ? inboundMatch[2] : "";
            let etaTime = (inboundMatch && inboundMatch[5]) ? inboundMatch[5] : ((inboundMatch && inboundMatch[4]) ? inboundMatch[4] : "");
            if(etaTime.length === 4) etaTime = etaTime.substring(0,2) + ":" + etaTime.substring(2);

            let routingMatch = text.match(/([A-Z]{3}-[A-Z]{3})\(VN/);
            let routing = routingMatch ? routingMatch[1] : "";

            let currentSection = '';
            let hasJ = false, hasW = false, hasY = false;

            for(let i=0; i<lines.length; i++) {
                let line = lines[i];
                if(line.includes("FLTNR") && line.includes("DEST")) {
                    let headerPart = line.substring(line.indexOf("CONX"));
                    hasJ = headerPart.includes("J");
                    hasW = headerPart.includes("W");
                    hasY = headerPart.includes("Y");
                    continue;
                }
                if(line.includes("POTENTIALLY MISSED")) { currentSection = 'Inside Min Connection Time'; continue; }
                if(line.includes("OUTBOUND CONNECTION") && !line.includes("POTENTIALLY")) { currentSection = 'Connection OK'; continue; }

                let parts = line.split(/(\d{2}H\d{2})/);
                if(parts.length >= 3 && currentSection) {
                    let leftPart = parts[0].trim().split(/\s+/);
                    let flt = leftPart[0];
                    let fltStd = leftPart[1];
                    let dest = leftPart.slice(2).join(" "); 
                    let conx = parts[1];
                    let numStr = parts[2].trim().split(/\s+/).filter(x => x !== "").map(Number);
                    
                    let term = "", gate = "";
                    if(i+1 < lines.length && lines[i+1].includes("TER:")) {
                        let tgMatch = lines[i+1].match(/TER:\s*(\w*)\s*GATE:\s*(\w*)/);
                        if(tgMatch) { term = tgMatch[1] || ""; gate = tgMatch[2] || ""; }
                    }

                    let idx = 0;
                    let b_j = 0, b_w = 0, b_y = 0, a_j = 0, a_w = 0, a_y = 0;
                    
                    if(hasJ) b_j = numStr[idx++] || 0;
                    if(hasW) b_w = numStr[idx++] || 0;
                    if(hasY) b_y = numStr[idx++] || 0;
                    if(hasJ) a_j = numStr[idx++] || 0;
                    if(hasW) a_w = numStr[idx++] || 0;
                    if(hasY) a_y = numStr[idx++] || 0;
                    
                    let bags = numStr[idx] || 0;
                    let totalBooked = b_j + b_w + b_y;
                    let totalAccepted = a_j + a_w + a_y;

                    if(totalBooked > 0 || totalAccepted > 0) { 
                        results[currentSection].push({ flt, fltStd, dest, conx, b_j, b_w, b_y, totalBooked, a_j, a_w, a_y, totalAccepted, bags, term, gate });
                    }
                }
            }
            return { inboundFlight, inboundDate, etaTime, routing, results };
        }

        function renderTable(dataObj) {
            let container = document.getElementById('report-container');
            let results = dataObj.results;
            
            let summaryHTML = "";
            if (results['Inside Min Connection Time'] && results['Inside Min Connection Time'].length > 0) {
                let reportLines = results['Inside Min Connection Time'].map(r => 
                    `- (B:${r.totalBooked} / A:${r.totalAccepted}) pax -> ${r.flt} ETD ${r.fltStd.substring(0,2)}:${r.fltStd.substring(2)}`
                );
                summaryHTML = `
                <div class="bg-yellow-100 border-l-4 border-yellow-500 p-2 md:p-4 mb-2 md:mb-4 text-yellow-900 shadow-sm rounded">
                    <h3 class="font-bold text-sm md:text-lg mb-1">CẢNH BÁO: KHÁCH NỐI CHUYẾN NGẮN</h3>
                    <div class="whitespace-pre-line leading-relaxed font-mono text-xs md:text-base">Chuyến đến ${dataObj.inboundFlight} ${dataObj.routing ? '('+dataObj.routing+')' : ''} ETA ${dataObj.etaTime}:
${reportLines.join('\n')}</div>
                </div>`;
            }

            let tableHTML = `
            <div class="mb-2 md:mb-4 flex flex-col md:flex-row md:items-center justify-between gap-1 md:gap-2">
                <h2 class="text-base md:text-xl font-bold text-blue-800"><i class="fa-solid fa-plane-arrival mr-1"></i>${dataObj.inboundFlight} ${dataObj.routing ? `[${dataObj.routing}]` : ''}</h2>
                <span class="bg-blue-100 text-blue-800 px-2 py-0.5 md:px-3 md:py-1 rounded-full text-[10px] md:text-sm font-semibold w-max"><i class="fa-regular fa-calendar mr-1"></i> ${dataObj.inboundDate} | ETA: ${dataObj.etaTime}</span>
            </div>
            
            <div class="text-[10px] md:text-xs text-blue-600 italic mb-1 md:hidden animate-pulse"><i class="fa-solid fa-arrows-left-right mr-1"></i> Vuốt ngang để xem bảng</div>
            
            <div class="table-scroll">
                <table class="w-full border-collapse bg-white shadow-sm min-w-[650px]">
                    <thead class="header-bg">
                        <tr>
                            <th rowspan="2" class="border col-min">Connection</th><th rowspan="2" class="border col-min">ATD</th><th rowspan="2" class="border col-min">ETD</th><th rowspan="2" class="border col-min">STD</th><th rowspan="2" class="border col-min">Act<br>Conx</th><th colspan="4" class="border text-center px-2">Customer Categories</th><th rowspan="2" class="border col-min">Final<br>Bags</th><th rowspan="2" class="border col-min">Dest.</th><th rowspan="2" class="border col-min">Term.</th><th rowspan="2" class="border col-min">Gate</th>
                        </tr>
                        <tr><th class="border col-min text-gray-500">Booked</th><th colspan="3" class="border col-min">Accepted</th></tr>
                        <tr><th class="border"></th><th class="border"></th><th class="border"></th><th class="border"></th><th class="border"></th><th class="border col-min text-gray-500">J W Y <span class="font-bold">Total</span></th><th class="border col-min">J</th><th class="border col-min">W</th><th class="border col-min">Y</th><th class="border col-min font-bold">Total</th><th class="border"></th><th class="border"></th><th class="border"></th><th class="border"></th></tr>
                    </thead>
                    <tbody>`;

            let rowCount = 0;
            ['Inside Min Connection Time', 'Connection OK'].forEach(section => {
                if(results[section] && results[section].length > 0) {
                    let sClass = (section === 'Inside Min Connection Time') ? 'danger-bg' : 'section-header';
                    tableHTML += `<tr><td colspan="14" class="${sClass}">${section}</td></tr>`;
                    results[section].forEach(row => {
                        if(rowCount >= 10) return; 
                        rowCount++;
                        let rClass = (section === 'Inside Min Connection Time') ? 'bg-red-50 text-red-700 font-semibold' : '';
                        let displayDest = row.dest.split(' ')[0]; 
                        let extraDest = row.dest.split(' ').length > 1 ? row.dest.split(' ')[1] : '';
                        
                        tableHTML += `
                        <tr class="${rClass} hover:bg-gray-50">
                            <td class="text-left col-min">${rowCount} &nbsp; ${row.flt} &nbsp; SGN-${displayDest}</td>
                            <td class="col-min"></td>
                            <td class="col-min"></td>
                            <td class="col-min">${row.fltStd.substring(0,2)}:${row.fltStd.substring(2)}</td>
                            <td class="col-min">${row.conx.toLowerCase()}</td>
                            <td class="col-min text-gray-400 text-[10px] md:text-xs">${row.b_j} ${row.b_w} ${row.b_y} &nbsp;<span class="font-bold text-gray-600">${row.totalBooked}</span></td>
                            <td class="col-min">${row.a_j}</td>
                            <td class="col-min">${row.a_w}</td>
                            <td class="col-min">${row.a_y}</td>
                            <td class="col-min font-bold">${row.totalAccepted}</td>
                            <td class="col-min font-bold text-blue-600">${row.bags}</td>
                            <td class="col-min text-[10px] md:text-xs">${extraDest}</td>
                            <td class="col-min">${row.term}</td>
                            <td class="col-min font-bold">${row.gate}</td>
                        </tr>`;
                    });
                }
            });
            tableHTML += `</tbody></table></div>`;
            container.innerHTML = summaryHTML + tableHTML;
        }

        async function loadHistory() {
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '<div class="text-center text-xs md:text-sm text-gray-500 py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang tải...</div>';
            try {
                const q = query(collection(db, 'reports'), orderBy('timestamp', 'desc'));
                const snapshot = await getDocs(q);
                listDiv.innerHTML = '';
                if(snapshot.empty) { listDiv.innerHTML = '<div class="text-center text-gray-400 text-xs md:text-sm mt-4">Chưa có lịch sử.</div>'; return; }
                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    let div = document.createElement('div');
                    div.className = "p-2 md:p-3 bg-white border rounded cursor-pointer hover:bg-blue-50 transition-colors shadow-sm flex justify-between items-center group";
                    div.innerHTML = `<div class="flex-1 overflow-hidden" onclick='viewReport(${JSON.stringify(data)})'><div class="font-bold text-blue-800 text-[11px] md:text-sm truncate">${data.inboundFlight} ${data.routing ? `[${data.routing}]` : ''}</div><div class="text-[10px] md:text-xs text-gray-500 mt-1"><i class="fa-regular fa-calendar-days mr-1"></i>${data.inboundDate} &nbsp;|&nbsp; ETA: <span class="font-semibold text-gray-700">${data.etaTime}</span></div></div><button onclick="deleteReport('${docSnap.id}')" class="text-gray-300 hover:text-red-500 transition-colors ml-2 p-1 md:p-2"><i class="fa-solid fa-trash"></i></button>`;
                    listDiv.appendChild(div);
                });
            } catch (err) {
                listDiv.innerHTML = '<div class="text-center text-red-500 text-xs md:text-sm py-4">Lỗi tải dữ liệu.</div>';
            }
        }

        window.viewReport = function(data) { renderTable(data); }
        window.deleteReport = async function(id) {
            if(confirm("Bạn có chắc chắn muốn xóa báo cáo này?")) {
                await deleteDoc(doc(db, 'reports', id));
                loadHistory(); 
                document.getElementById('report-container').innerHTML = '<div class="text-center text-gray-400 mt-10 md:mt-20 italic text-sm md:text-base">Báo cáo đã bị xóa.</div>';
            }
        }
    </script>
</body>
</html>
